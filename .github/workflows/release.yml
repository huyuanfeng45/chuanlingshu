name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac-dmg:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned DMG
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          UPLOAD_DMG="dist/chuanlingshu-${VERSION}-arm64.dmg"
          cp "dist/传令书-${VERSION}-arm64.dmg" "$UPLOAD_DMG"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$UPLOAD_DMG" --clobber
          else
            gh release create "$TAG_NAME" "$UPLOAD_DMG" \
              --title "传令书 ${TAG_NAME}" \
              --notes "传令书 ${TAG_NAME} 自动构建发布包。"
          fi
